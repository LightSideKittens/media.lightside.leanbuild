name: Publish to Registry

on:
  push:
    tags: ["v*"]

env:
  PACKAGE: media.lightside.lean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Locate release branch
        id: source
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --no-tags --prune --quiet

          DEFAULT=$(git ls-remote --symref origin HEAD \
            | sed -n 's|^ref: refs/heads/\(.*\)[[:space:]]HEAD$|\1|p')
          mapfile -t points < <(git for-each-ref --points-at HEAD \
            --format='%(refname:strip=3)' refs/remotes/origin | sed '/^HEAD$/d;/^$/d')
          mapfile -t contains < <(git for-each-ref --contains HEAD \
            --format='%(refname:strip=3)' refs/remotes/origin | sed '/^HEAD$/d;/^$/d')

          BRANCH=""
          for b in "${contains[@]}"; do
            if [ "$b" = "$DEFAULT" ]; then BRANCH="$DEFAULT"; fi
          done
          if [ -z "$BRANCH" ] && [ "${#points[@]}" -eq 1 ]; then BRANCH="${points[0]}"; fi
          if [ -z "$BRANCH" ] && [ "${#contains[@]}" -eq 1 ]; then BRANCH="${contains[0]}"; fi
          if [ -z "$BRANCH" ]; then
            echo "Cannot determine the release branch for $GITHUB_REF_NAME."
            printf '  candidate: %s\n' "${contains[@]}"
            echo "Push the tagged commit as the tip of the intended branch, then re-run this workflow."
            exit 1
          fi

          TAG_REF=$(git ls-remote --refs origin "refs/tags/$GITHUB_REF_NAME" | cut -f1)
          if [ -z "$TAG_REF" ]; then
            echo "Tag $GITHUB_REF_NAME is not present on the remote."
            exit 1
          fi

          echo "Release branch: $BRANCH"
          {
            echo "branch=$BRANCH"
            echo "branch_sha=$(git rev-parse "refs/remotes/origin/$BRANCH")"
            echo "tag_sha=$(git rev-parse HEAD)"
            echo "tag_ref=$TAG_REF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Extract version and determine dist-tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            TAG="${PRERELEASE%%.*}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Detected pre-release: tag=$TAG"
          else
            CURRENT=$(curl -sf -H "Authorization: Bearer ${{ secrets.REGISTRY_TOKEN }}" \
              "https://registry.lightside.media/$PACKAGE" 2>/dev/null \
              | node -e "try{const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(d['dist-tags']?.latest||'')}catch{}" 2>/dev/null)

            if [ -n "$CURRENT" ]; then
              CURRENT_MAJOR="${CURRENT%%.*}"
              NEW_MAJOR="${VERSION%%.*}"
              if [ "$NEW_MAJOR" -lt "$CURRENT_MAJOR" ] 2>/dev/null; then
                TAG="v$NEW_MAJOR"
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                echo "Older major version: tag=$TAG (latest is $CURRENT)"
              else
                TAG="latest"
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                echo "New stable release: tag=latest"
              fi
            else
              TAG="latest"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "First publish: tag=latest"
            fi
          fi

      - name: Set version in package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.meta.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 4) + '\n');
          "

      - name: Pack tarball
        run: |
          npm pack
          test -f "$PACKAGE-${{ steps.meta.outputs.version }}.tgz"

      - name: Upload tarball to R2
        run: |
          npx wrangler r2 object put "registry-packages/$PACKAGE-${{ steps.meta.outputs.version }}.tgz" \
            --file="$PACKAGE-${{ steps.meta.outputs.version }}.tgz" \
            --content-type="application/octet-stream" \
            --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Register metadata
        run: |
          MANIFEST=$(node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dist = { tarball: 'https://registry.lightside.media/$PACKAGE/-/$PACKAGE-${{ steps.meta.outputs.version }}.tgz' };
            console.log(JSON.stringify(pkg));
          ")

          curl -svf -X POST "https://registry.lightside.media/-/admin/publish" \
            -H "Authorization: Bearer ${{ secrets.REGISTRY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$PACKAGE\",
              \"version\": \"${{ steps.meta.outputs.version }}\",
              \"tag\": \"${{ steps.meta.outputs.tag }}\",
              \"manifest\": $MANIFEST
            }"

          echo ""
          echo "Published $PACKAGE@${{ steps.meta.outputs.version }} with tag=${{ steps.meta.outputs.tag }}"

      - name: Finalize release commit
        shell: bash
        env:
          BRANCH: ${{ steps.source.outputs.branch }}
          BRANCH_SHA: ${{ steps.source.outputs.branch_sha }}
          TAG_SHA: ${{ steps.source.outputs.tag_sha }}
          TAG_REF: ${{ steps.source.outputs.tag_ref }}
        run: |
          git add package.json
          if git diff --cached --quiet; then
            echo "The release commit already contains the published version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --amend --no-edit
          NEW_SHA=$(git rev-parse HEAD)

          if [ "$TAG_SHA" = "$BRANCH_SHA" ]; then
            PUSH_SRC="$NEW_SHA"
          else
            git branch -f "$BRANCH" "$BRANCH_SHA"
            git rebase --onto "$NEW_SHA" "$TAG_SHA" "$BRANCH"
            PUSH_SRC="refs/heads/$BRANCH"
          fi

          git tag -f "$GITHUB_REF_NAME" "$NEW_SHA"
          git push --atomic \
            --force-with-lease="refs/heads/$BRANCH:$BRANCH_SHA" \
            --force-with-lease="refs/tags/$GITHUB_REF_NAME:$TAG_REF" \
            origin "$PUSH_SRC:refs/heads/$BRANCH" "refs/tags/$GITHUB_REF_NAME"
